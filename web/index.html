<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TS1 Laser</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <section class="status">
        <h1>TS1 Laser</h1>
        <dl>
          <div><dt>Machine</dt><dd id="machine-state">offline</dd></div>
          <div><dt>Homed</dt><dd id="homed">false</dd></div>
          <div><dt>K1</dt><dd id="k1">off</dd></div>
          <div><dt>K2</dt><dd id="k2">off</dd></div>
          <div><dt>LightBurn</dt><dd id="lightburn">disconnected</dd></div>
          <div><dt>Mode</dt><dd id="mode">network</dd></div>
        </dl>
        <p id="error" hidden></p>
      </section>

      <section class="camera">
        <h2>Camera</h2>
        <div id="camera-frame">
          <span>No camera stream configured</span>
        </div>
      </section>

      <section class="actions">
        <button id="stop" type="button">STOP</button>
        <button id="estop" type="button">E-STOP</button>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
