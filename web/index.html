<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Laser</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <section class="laser-status" aria-live="polite">
        <span id="laser-status">LASER FAULT</span>
      </section>

      <section class="camera">
        <h2>Camera</h2>
        <div id="camera-frame">
          <span id="camera-placeholder">Camera stream loading</span>
        </div>
      </section>

      <section class="actions">
        <button id="home" type="button">HOME</button>
        <button id="estop" type="button">E-STOP</button>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
