<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel-Laser Local Touchscreen Walkthrough</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0f14;
        --screen: #101820;
        --panel: #1b2733;
        --panel-2: #22303d;
        --line: #3d4d5e;
        --text: #f2f6fb;
        --muted: #afbcc9;
        --blue: #0876d9;
        --green: #19a83a;
        --red: #d52626;
        --yellow: #d8a900;
        --gray: #607080;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 24px;
        background: #111820;
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .shell {
        width: min(100%, 980px);
        display: grid;
        justify-items: center;
        gap: 14px;
      }

      .screen {
        width: min(100%, 960px);
        aspect-ratio: 480 / 320;
        max-height: calc(100vh - 130px);
        background: var(--screen);
        border: 2px solid #5b6775;
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
      }

      .topbar {
        height: 42px;
        background: #17232e;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid #314151;
      }

      .brand {
        font-weight: 700;
        font-size: clamp(18px, 4.4vw, 25px);
      }

      .state {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: clamp(13px, 2.8vw, 16px);
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #24d354;
      }

      .content {
        height: calc(100% - 98px);
        padding: 16px;
      }

      .nav {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 56px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 1px;
        background: #24313e;
        border-top: 1px solid #314151;
      }

      button {
        border: 0;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .nav button {
        background: #202c38;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        min-height: 48px;
      }

      .nav button.active {
        background: var(--blue);
      }

      .nav .icon {
        font-size: 20px;
        line-height: 1;
      }

      .nav .label {
        font-size: clamp(11px, 2.6vw, 14px);
      }

      .home-actions {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: center;
      }

      .action {
        height: min(78%, 154px);
        min-height: 126px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 12px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        font-size: clamp(24px, 8vw, 44px);
        font-weight: 700;
      }

      .action small {
        font-size: clamp(13px, 2.8vw, 16px);
        font-weight: 500;
        opacity: 0.9;
      }

      .home {
        background: linear-gradient(#24c34c, #14872e);
      }

      .stop {
        background: linear-gradient(#f13b3b, #b91515);
      }

      .rows {
        display: grid;
        gap: 8px;
      }

      .row {
        min-height: 30px;
        display: grid;
        grid-template-columns: 1fr minmax(110px, 38%);
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: clamp(14px, 3.2vw, 19px);
      }

      .pill {
        justify-self: stretch;
        text-align: center;
        padding: 6px 10px;
        border-radius: 9px;
        font-weight: 700;
        font-size: clamp(12px, 2.8vw, 15px);
      }

      .ok {
        background: var(--green);
      }

      .warn {
        background: var(--yellow);
        color: #111820;
      }

      .neutral {
        background: var(--gray);
      }

      .bad {
        background: var(--red);
      }

      .network-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        height: 100%;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
      }

      .network-list {
        grid-column: 1 / -1;
        display: grid;
        gap: 4px;
      }

      .ssid {
        min-height: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        background: #14202b;
        border: 1px solid #2e3c4b;
        border-radius: 5px;
      }

      .ssid.selected {
        background: var(--blue);
      }

      .toolbar {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .tool {
        min-height: 42px;
        border-radius: 7px;
        background: #263544;
      }

      .tool.primary {
        background: var(--blue);
      }

      .mode-grid {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-items: center;
      }

      .mode-card {
        min-height: 128px;
        display: grid;
        align-content: center;
        gap: 10px;
        padding: 18px;
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 10px;
      }

      .mode-card.active {
        border-color: var(--blue);
        background: #0d3a65;
      }

      .mode-card strong {
        font-size: clamp(20px, 4vw, 24px);
      }

      .system-list {
        display: grid;
        gap: 7px;
      }

      .system-item {
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 7px;
        font-size: clamp(14px, 3.2vw, 18px);
      }

      .danger {
        color: #ff5a5a;
      }

      .modal-backdrop {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(0, 0, 0, 0.44);
      }

      .modal-backdrop.open {
        display: grid;
      }

      .modal {
        width: min(78%, 360px);
        padding: 20px;
        border-radius: 12px;
        background: #121a23;
        border: 2px solid #6a7a8a;
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.48);
      }

      .modal h2 {
        margin: 0 0 12px;
        font-size: 22px;
      }

      .modal p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.35;
      }

      .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .modal-actions button {
        min-height: 42px;
        border-radius: 7px;
        background: var(--gray);
      }

      .modal-actions .primary {
        background: var(--blue);
      }

      .caption {
        color: #c8d1dc;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="screen" aria-label="Travel-Laser local touchscreen walkthrough">
        <div class="topbar">
          <div class="brand">Travel-Laser</div>
          <div class="state"><span class="dot"></span><span id="top-state">Ready</span></div>
        </div>
        <div class="content" id="content"></div>
        <nav class="nav" aria-label="Screen navigation">
          <button data-screen="home"><span class="icon">⌂</span><span class="label">Home</span></button>
          <button data-screen="status"><span class="icon">▥</span><span class="label">Status</span></button>
          <button data-screen="net"><span class="icon">≋</span><span class="label">Net</span></button>
          <button data-screen="mode"><span class="icon">◉</span><span class="label">Mode</span></button>
          <button data-screen="system"><span class="icon">☰</span><span class="label">System</span></button>
        </nav>
        <div class="modal-backdrop" id="modal-backdrop">
          <div class="modal" id="modal"></div>
        </div>
      </section>
      <div class="caption">Offline walkthrough. Open this file directly in a browser; no server or internet connection is required.</div>
    </main>

    <script>
      const content = document.getElementById("content");
      const modalBackdrop = document.getElementById("modal-backdrop");
      const modal = document.getElementById("modal");
      let currentScreen = "home";
      let selectedSsid = "Workshop WiFi";

      const screens = {
        home: renderHome,
        status: renderStatus,
        net: renderNetwork,
        mode: renderMode,
        system: renderSystem,
      };

      document.querySelectorAll(".nav button").forEach((button) => {
        button.addEventListener("click", () => showScreen(button.dataset.screen));
      });

      function showScreen(screen) {
        currentScreen = screen;
        content.innerHTML = screens[screen]();
        document.querySelectorAll(".nav button").forEach((button) => {
          button.classList.toggle("active", button.dataset.screen === screen);
        });
        wireScreen(screen);
      }

      function renderHome() {
        return `
          <div class="home-actions">
            <button class="action home" data-action="home">
              <span>HOME</span>
              <small>Run GRBL homing</small>
            </button>
            <button class="action stop" data-action="stop">
              <span>STOP</span>
              <small>Feed hold / stop stream</small>
            </button>
          </div>
        `;
      }

      function renderStatus() {
        return `
          <div class="rows">
            ${row("GRBL State", "Idle", "ok")}
            ${row("LightBurn", "Connected", "ok")}
            ${row("Active Stream", "None", "neutral")}
            ${row("Power", "12V OK", "ok")}
            ${row("E-stop Sense", "OK", "ok")}
            ${row("Safety Relay", "Engaged", "ok")}
            ${row("Laser USB", "Connected", "ok")}
          </div>
        `;
      }

      function renderNetwork() {
        const ssids = ["Workshop WiFi", "TravelLaser-Guest", "Office", "Other..."];
        return `
          <div class="network-grid">
            <div class="card"><strong>Ethernet</strong><br><span class="muted">Connected</span></div>
            <div class="card"><strong>Wi-Fi</strong><br><span class="muted">${selectedSsid}</span></div>
            <div class="card network-list">
              <strong>Available Wi-Fi Networks</strong>
              ${ssids.map((ssid) => `<button class="ssid ${ssid === selectedSsid ? "selected" : ""}" data-ssid="${ssid}"><span>${ssid}</span><span>${ssid === selectedSsid ? "selected" : "locked"}</span></button>`).join("")}
            </div>
            <div class="toolbar">
              <button class="tool" data-action="scan">Scan</button>
              <button class="tool primary" data-action="connect">Connect</button>
              <button class="tool" data-action="forget">Forget</button>
              <button class="tool" data-action="refresh">Refresh</button>
            </div>
          </div>
        `;
      }

      function renderMode() {
        return `
          <div class="mode-grid">
            <button class="mode-card active" data-mode="network">
              <strong>Network Mode</strong>
              <span class="muted">USB connected to Orange Pi</span>
            </button>
            <button class="mode-card" data-mode="virtualhere">
              <strong>VirtualHere Service Mode</strong>
              <span class="muted">USB shared over network</span>
            </button>
          </div>
        `;
      }

      function renderSystem() {
        return `
          <div class="system-list">
            ${systemItem("GPIO Status")}
            ${systemItem("USB Identity")}
            ${systemItem("SPI / I2C")}
            ${systemItem("View Logs")}
            ${systemItem("Restart Services")}
            ${systemItem("Reboot")}
            ${systemItem("Shutdown", true)}
          </div>
        `;
      }

      function row(label, value, tone) {
        return `<div class="row"><span>${label}</span><span class="pill ${tone}">${value}</span></div>`;
      }

      function systemItem(label, danger = false) {
        return `<button class="system-item ${danger ? "danger" : ""}"><span>${label}</span><span>›</span></button>`;
      }

      function wireScreen(screen) {
        if (screen === "home") {
          content.querySelector('[data-action="home"]').addEventListener("click", () => {
            openModal("Run Home", "Send the standard GRBL homing command now?", "Cancel", "Home");
          });
          content.querySelector('[data-action="stop"]').addEventListener("click", () => {
            openModal("Stop", "Send stop/feed-hold to the controller?", "Cancel", "Stop");
          });
        }
        if (screen === "net") {
          content.querySelectorAll("[data-ssid]").forEach((button) => {
            button.addEventListener("click", () => {
              selectedSsid = button.dataset.ssid;
              showScreen("net");
            });
          });
          content.querySelector('[data-action="connect"]').addEventListener("click", () => {
            openModal("Wi-Fi Password", `Enter password for ${selectedSsid}.`, "Cancel", "Connect");
          });
          content.querySelector('[data-action="forget"]').addEventListener("click", () => {
            openModal("Forget Network", `Forget ${selectedSsid}?`, "Cancel", "Forget");
          });
        }
        if (screen === "mode") {
          content.querySelectorAll("[data-mode]").forEach((button) => {
            button.addEventListener("click", () => {
              if (button.dataset.mode === "network") return;
              openModal("Confirm Mode Change", "Only one mode can own USB at a time. Switching modes releases the current USB owner.", "Cancel", "Switch");
            });
          });
        }
      }

      function openModal(title, message, cancelText, confirmText) {
        modal.innerHTML = `
          <h2>${title}</h2>
          <p>${message}</p>
          <div class="modal-actions">
            <button data-close>${cancelText}</button>
            <button class="primary" data-close>${confirmText}</button>
          </div>
        `;
        modalBackdrop.classList.add("open");
        modal.querySelectorAll("[data-close]").forEach((button) => {
          button.addEventListener("click", closeModal);
        });
      }

      function closeModal() {
        modalBackdrop.classList.remove("open");
      }

      modalBackdrop.addEventListener("click", (event) => {
        if (event.target === modalBackdrop) closeModal();
      });

      showScreen("home");
    </script>
  </body>
</html>
