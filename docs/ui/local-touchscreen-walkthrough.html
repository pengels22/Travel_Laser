<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel-Laser Local Touchscreen Walkthrough</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0f14;
        --screen: #101820;
        --panel: #1b2733;
        --panel-2: #22303d;
        --line: #3d4d5e;
        --text: #f2f6fb;
        --muted: #afbcc9;
        --blue: #0876d9;
        --green: #19a83a;
        --red: #d52626;
        --yellow: #d8a900;
        --gray: #607080;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 18px;
        padding: 24px;
        background: #111820;
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .shell {
        width: 480px;
        max-width: calc(100vw - 24px);
        display: grid;
        justify-items: center;
        gap: 14px;
      }

      .screen {
        width: 480px;
        height: 320px;
        max-width: calc(100vw - 24px);
        background: var(--screen);
        border: 2px solid #5b6775;
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
      }

      .topbar {
        height: 42px;
        background: #17232e;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid #314151;
      }

      .brand {
        font-weight: 700;
        font-size: clamp(18px, 4.4vw, 25px);
      }

      .state {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: clamp(13px, 2.8vw, 16px);
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #24d354;
      }

      .content {
        height: calc(100% - 98px);
        padding: 16px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: var(--muted) transparent;
        touch-action: pan-y;
        cursor: grab;
        -webkit-overflow-scrolling: touch;
        user-select: none;
      }

      .content.dragging {
        cursor: grabbing;
      }

      .content::-webkit-scrollbar {
        width: 6px;
      }

      .content::-webkit-scrollbar-track {
        background: transparent;
      }

      .content::-webkit-scrollbar-thumb {
        background: var(--muted);
        border-radius: 999px;
      }

      .nav {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 56px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 1px;
        background: #24313e;
        border-top: 1px solid #314151;
      }

      button {
        border: 0;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .nav button {
        background: #202c38;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        min-height: 48px;
      }

      .nav button.active {
        background: var(--blue);
      }

      .nav .icon {
        font-size: 20px;
        line-height: 1;
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
      }

      .nav .icon svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }

      .nav .label {
        font-size: clamp(11px, 2.6vw, 14px);
      }

      .home-actions {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        align-items: center;
      }

      .action {
        height: min(78%, 154px);
        min-height: 126px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 12px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        font-size: clamp(24px, 8vw, 44px);
        font-weight: 700;
      }

      .action small {
        font-size: clamp(13px, 2.8vw, 16px);
        font-weight: 500;
        opacity: 0.9;
      }

      .home {
        background: linear-gradient(#24c34c, #14872e);
      }

      .stop {
        background: linear-gradient(#f13b3b, #b91515);
      }

      .rows {
        display: grid;
        gap: 8px;
      }

      .row {
        min-height: 30px;
        display: grid;
        grid-template-columns: 1fr minmax(110px, 38%);
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: clamp(14px, 3.2vw, 19px);
      }

      .pill {
        justify-self: stretch;
        text-align: center;
        padding: 6px 10px;
        border-radius: 9px;
        font-weight: 700;
        font-size: clamp(12px, 2.8vw, 15px);
      }

      .ok {
        background: var(--green);
      }

      .warn {
        background: var(--yellow);
        color: #111820;
      }

      .neutral {
        background: var(--gray);
      }

      .bad {
        background: var(--red);
      }

      .network-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
      }

      .network-list {
        grid-column: 1 / -1;
        display: grid;
        gap: 4px;
      }

      .ssid {
        min-height: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        background: #14202b;
        border: 1px solid #2e3c4b;
        border-radius: 5px;
      }

      .ssid.selected {
        background: var(--blue);
      }

      .toolbar {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .tool {
        min-height: 42px;
        border-radius: 7px;
        background: #263544;
      }

      .mode-grid {
        min-height: 188px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-items: center;
      }

      .mode-card {
        min-height: 128px;
        display: grid;
        align-content: center;
        gap: 10px;
        padding: 18px;
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: 10px;
      }

      .mode-card.active {
        border-color: var(--blue);
        background: #0d3a65;
      }

      .mode-card strong {
        font-size: clamp(20px, 4vw, 24px);
      }

      .system-list {
        display: grid;
        gap: 7px;
      }

      .subpage {
        display: grid;
        gap: 8px;
      }

      .subhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .back {
        min-height: 34px;
        padding: 0 14px;
        border-radius: 7px;
        background: var(--blue);
      }

      .log-box {
        height: 152px;
        overflow: hidden;
        padding: 10px;
        border-radius: 8px;
        background: #090f14;
        border: 1px solid var(--line);
        color: #d8e2ed;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.35;
        white-space: pre-wrap;
      }

      .system-item {
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 7px;
        font-size: clamp(14px, 3.2vw, 18px);
      }

      .danger {
        color: #ff5a5a;
      }

      .modal-backdrop {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(0, 0, 0, 0.44);
      }

      .modal-backdrop.open {
        display: grid;
      }

      .modal {
        width: min(78%, 360px);
        max-height: 296px;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 20px;
        border-radius: 12px;
        background: #121a23;
        border: 2px solid #6a7a8a;
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.48);
      }

      .modal h2 {
        margin: 0 0 12px;
        font-size: 22px;
      }

      .modal p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.35;
      }

      .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .modal-actions button {
        min-height: 42px;
        border-radius: 7px;
        background: var(--gray);
      }

      .modal-actions .primary {
        background: var(--blue);
      }

      .text-entry {
        width: 100%;
        min-height: 38px;
        margin: 0 0 12px;
        padding: 8px 10px;
        border-radius: 7px;
        background: #0a1118;
        border: 1px solid var(--line);
        color: var(--text);
        font-size: 18px;
      }

      .keyboard {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }

      .key-row {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 5px;
      }

      .key-row:last-child {
        grid-template-columns: 1.3fr repeat(7, 1fr) 1.3fr;
      }

      .key {
        min-height: 31px;
        border-radius: 5px;
        background: #263544;
        font-size: 14px;
      }

      .key.wide {
        grid-column: span 3;
      }

      .caption {
        color: #c8d1dc;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="screen" aria-label="Travel-Laser local touchscreen walkthrough">
        <div class="topbar">
          <div class="brand">Travel-Laser</div>
          <div class="state"><span class="dot"></span><span id="top-state">Ready</span></div>
        </div>
        <div class="content" id="content"></div>
        <nav class="nav" aria-label="Screen navigation">
          <button data-screen="home"><span class="icon">⌂</span><span class="label">Home</span></button>
          <button data-screen="status"><span class="icon">▥</span><span class="label">Status</span></button>
          <button data-screen="net"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3c2.2 2.4 3.3 5.4 3.3 9s-1.1 6.6-3.3 9"></path><path d="M12 3c-2.2 2.4-3.3 5.4-3.3 9s1.1 6.6 3.3 9"></path></svg></span><span class="label">Net</span></button>
          <button data-screen="mode"><span class="icon">◉</span><span class="label">Mode</span></button>
          <button data-screen="system"><span class="icon">☰</span><span class="label">System</span></button>
        </nav>
        <div class="modal-backdrop" id="modal-backdrop">
          <div class="modal" id="modal"></div>
        </div>
      </section>
      <div class="caption">Offline walkthrough. Open this file directly in a browser; no server or internet connection is required.</div>
    </main>

    <script>
      const content = document.getElementById("content");
      const modalBackdrop = document.getElementById("modal-backdrop");
      const modal = document.getElementById("modal");
      const idleHomeTimeoutMs = 20000;
      const controlScrollHoldMs = 300;
      let currentScreen = "home";
      let selectedSsid = "Workshop WiFi";
      let passwordText = "";
      let lastInputAt = Date.now();
      let dragStartY = 0;
      let dragStartScrollTop = 0;
      let dragMoved = false;
      let isDraggingContent = false;
      let dragPendingControl = false;
      let dragPendingStartedAt = 0;

      const screens = {
        home: renderHome,
        status: renderStatus,
        net: renderNetwork,
        mode: renderMode,
        system: renderSystem,
        "system-gpio": renderGpioStatus,
        "system-usb": renderUsbIdentity,
        "system-spi": renderSpiI2c,
        "system-logs": renderLogs,
      };

      document.querySelectorAll(".nav button").forEach((button) => {
        button.addEventListener("click", () => showScreen(button.dataset.screen));
      });
      document.addEventListener("pointerdown", resetIdleTimer);
      document.addEventListener("keydown", resetIdleTimer);
      content.addEventListener("pointerdown", startContentDrag);
      content.addEventListener("pointermove", moveContentDrag);
      content.addEventListener("pointerup", endContentDrag);
      content.addEventListener("pointercancel", endContentDrag);
      content.addEventListener("click", suppressClickAfterDrag, true);
      setInterval(returnHomeAfterIdle, 1000);

      function showScreen(screen) {
        currentScreen = screen;
        content.innerHTML = screens[screen]();
        content.scrollTop = 0;
        document.querySelectorAll(".nav button").forEach((button) => {
          button.classList.toggle("active", button.dataset.screen === screen);
        });
        wireScreen(screen);
      }

      function renderHome() {
        return `
          <div class="home-actions">
            <button class="action home" data-action="home">
              <span>HOME</span>
              <small>Run GRBL homing</small>
            </button>
            <button class="action stop" data-action="stop">
              <span>STOP</span>
              <small>Feed hold / stop stream</small>
            </button>
          </div>
        `;
      }

      function renderStatus() {
        return `
          <div class="rows">
            ${row("GRBL State", "Idle", "ok")}
            ${row("LightBurn", "Connected", "ok")}
            ${row("Active Stream", "None", "neutral")}
            ${row("Power", "12V OK", "ok")}
            ${row("E-stop Sense", "OK", "ok")}
            ${row("Safety Relay", "Engaged", "ok")}
            ${row("Laser USB", "Connected", "ok")}
            ${row("Tailscale", "Waiting", "warn")}
          </div>
        `;
      }

      function renderNetwork() {
        const ssids = ["Workshop WiFi", "TravelLaser-Guest", "Office", "Other..."];
        return `
          <div class="network-grid">
            <div class="card"><strong>Ethernet</strong><br><span class="muted">Connected</span><br><span class="muted">192.168.1.42</span></div>
            <div class="card"><strong>Wi-Fi</strong><br><span class="muted">${selectedSsid}</span><br><span class="muted">192.168.1.58</span></div>
            <div class="card network-list">
              <strong>Available Wi-Fi Networks</strong>
              ${ssids.map((ssid) => `<button class="ssid ${ssid === selectedSsid ? "selected" : ""}" data-ssid="${ssid}"><span>${ssid}</span><span>${ssid === selectedSsid ? "selected" : "locked"}</span></button>`).join("")}
            </div>
            <div class="toolbar">
              <button class="tool" data-action="scan">Scan</button>
              <button class="tool" data-action="connect">Connect</button>
              <button class="tool" data-action="forget">Forget</button>
              <button class="tool" data-action="refresh">Refresh</button>
            </div>
          </div>
        `;
      }

      function renderMode() {
        return `
          <div class="mode-grid">
            <button class="mode-card active" data-mode="network">
              <strong>Network Mode</strong>
              <span class="muted">USB connected to Orange Pi</span>
            </button>
            <button class="mode-card" data-mode="virtualhere">
              <strong>VirtualHere Service Mode</strong>
              <span class="muted">USB shared over network</span>
            </button>
          </div>
        `;
      }

      function renderSystem() {
        return `
          <div class="system-list">
            ${systemItem("GPIO Status", "system-gpio")}
            ${systemItem("USB Identity", "system-usb")}
            ${systemItem("SPI / I2C", "system-spi")}
            ${systemItem("View Logs", "system-logs")}
            ${systemItem("Export Logs to USB")}
            ${systemItem("Restart Services")}
            ${systemItem("Reboot")}
            ${systemItem("Shutdown", "", true)}
          </div>
        `;
      }

      function renderGpioStatus() {
        return `
          <div class="subpage">
            ${subhead("GPIO Status")}
            ${row("Power", "High", "ok")}
            ${row("E-stop Sense", "OK", "ok")}
            ${row("Safety Relay", "High", "ok")}
            ${row("LCD Reset", "High", "ok")}
            ${row("Touch Reset", "High", "ok")}
            ${row("Touch Interrupt", "Optional", "neutral")}
          </div>
        `;
      }

      function renderUsbIdentity() {
        return `
          <div class="subpage">
            ${subhead("USB Identity")}
            ${row("Laser Controller", "Matched", "ok")}
            ${row("Laser USB", "Connected", "ok")}
            ${row("Camera", "Matched", "ok")}
            ${row("Export Drive", "None", "neutral")}
          </div>
        `;
      }

      function renderSpiI2c() {
        return `
          <div class="subpage">
            ${subhead("SPI / I2C")}
            ${row("Display SPI", "/dev/spidev1.0", "ok")}
            ${row("Touch I2C", "/dev/i2c-3", "ok")}
            ${row("Touch Address", "0x38", "ok")}
            ${row("Touch Interrupt", "Optional", "neutral")}
          </div>
        `;
      }

      function renderLogs() {
        return `
          <div class="subpage">
            ${subhead("View Logs")}
            <div class="log-box">20:14:05 INFO controller ready in network mode
20:14:07 INFO web portal waiting for Tailscale IP
20:14:10 INFO laser usb connected
20:14:12 INFO LightBurn connected
20:15:03 INFO status poll: Idle
20:15:30 INFO USB log export waiting for drive over 200 MB</div>
          </div>
        `;
      }

      function row(label, value, tone) {
        return `<div class="row"><span>${label}</span><span class="pill ${tone}">${value}</span></div>`;
      }

      function subhead(title) {
        return `<div class="subhead"><button class="back" data-screen="system">Back</button><strong>${title}</strong><span></span></div>`;
      }

      function systemItem(label, screen = "", danger = false) {
        return `<button class="system-item ${danger ? "danger" : ""}" ${screen ? `data-screen="${screen}"` : `data-system-action="${label}"`}><span>${label}</span><span>›</span></button>`;
      }

      function wireScreen(screen) {
        if (screen === "home") {
          content.querySelector('[data-action="home"]').addEventListener("click", () => {
            openModal("Run Home", "Send the standard GRBL homing command now?", "Cancel", "Home");
          });
          content.querySelector('[data-action="stop"]').addEventListener("click", () => {
            openModal("Stop", "Send stop/feed-hold to the controller?", "Cancel", "Stop");
          });
        }
        if (screen === "net") {
          content.querySelectorAll("[data-ssid]").forEach((button) => {
            button.addEventListener("click", () => {
              selectedSsid = button.dataset.ssid;
              showScreen("net");
            });
          });
          content.querySelector('[data-action="connect"]').addEventListener("click", () => {
            openKeyboardModal("Wi-Fi Password", `Enter password for ${selectedSsid}.`, "Cancel", "Connect");
          });
          content.querySelector('[data-action="forget"]').addEventListener("click", () => {
            openModal("Forget Network", `Forget ${selectedSsid}?`, "Cancel", "Forget");
          });
        }
        if (screen === "mode") {
          content.querySelectorAll("[data-mode]").forEach((button) => {
            button.addEventListener("click", () => {
              if (button.dataset.mode === "network") return;
              openModal("Confirm Mode Change", "Only one mode can own USB at a time. Switching modes releases the current USB owner.", "Cancel", "Switch");
            });
          });
        }
        if (screen === "system") {
          content.querySelectorAll("[data-screen]").forEach((button) => {
            button.addEventListener("click", () => showScreen(button.dataset.screen));
          });
          content.querySelectorAll("[data-system-action]").forEach((button) => {
            button.addEventListener("click", () => {
              openModal(button.dataset.systemAction, "This action opens a confirmation or progress dialog on hardware.", "Close", "OK");
            });
          });
        }
        if (screen.startsWith("system-")) {
          content.querySelectorAll("[data-screen]").forEach((button) => {
            button.addEventListener("click", () => showScreen(button.dataset.screen));
          });
        }
      }

      function openModal(title, message, cancelText, confirmText) {
        modal.innerHTML = `
          <h2>${title}</h2>
          <p>${message}</p>
          <div class="modal-actions">
            <button data-close>${cancelText}</button>
            <button class="primary" data-close>${confirmText}</button>
          </div>
        `;
        modalBackdrop.classList.add("open");
        modal.querySelectorAll("[data-close]").forEach((button) => {
          button.addEventListener("click", closeModal);
        });
      }

      function closeModal() {
        modalBackdrop.classList.remove("open");
      }

      function resetIdleTimer() {
        lastInputAt = Date.now();
      }

      function returnHomeAfterIdle() {
        if (Date.now() - lastInputAt < idleHomeTimeoutMs) return;
        if (modalBackdrop.classList.contains("open")) closeModal();
        if (currentScreen !== "home") showScreen("home");
        resetIdleTimer();
      }

      function startContentDrag(event) {
        if (event.button !== 0 && event.pointerType === "mouse") return;
        isDraggingContent = true;
        dragPendingControl = Boolean(event.target.closest("button, input, textarea, select, a"));
        dragPendingStartedAt = Date.now();
        dragMoved = false;
        dragStartY = event.clientY;
        dragStartScrollTop = content.scrollTop;
        if (!dragPendingControl) {
          content.setPointerCapture(event.pointerId);
        }
      }

      function moveContentDrag(event) {
        if (!isDraggingContent) return;
        if (dragPendingControl && Date.now() - dragPendingStartedAt < controlScrollHoldMs) return;
        if (dragPendingControl && !content.hasPointerCapture(event.pointerId)) {
          content.setPointerCapture(event.pointerId);
        }
        dragPendingControl = false;
        const deltaY = event.clientY - dragStartY;
        if (Math.abs(deltaY) > 3) dragMoved = true;
        if (dragMoved) content.classList.add("dragging");
        content.scrollTop = dragStartScrollTop - deltaY;
        resetIdleTimer();
      }

      function endContentDrag(event) {
        if (!isDraggingContent) return;
        isDraggingContent = false;
        dragPendingControl = false;
        content.classList.remove("dragging");
        if (content.hasPointerCapture(event.pointerId)) {
          content.releasePointerCapture(event.pointerId);
        }
      }

      function suppressClickAfterDrag(event) {
        if (!dragMoved) return;
        event.preventDefault();
        event.stopPropagation();
        dragMoved = false;
      }

      function openKeyboardModal(title, message, cancelText, confirmText) {
        passwordText = "";
        modal.innerHTML = `
          <h2>${title}</h2>
          <p>${message}</p>
          <input class="text-entry" id="keyboard-entry" type="password" value="" readonly aria-label="${title}">
          <div class="keyboard">
            ${keyRow("1234567890")}
            ${keyRow("qwertyuiop")}
            ${keyRow("asdfghjkl")}
            <div class="key-row">
              <button class="key" data-key="z">z</button>
              <button class="key" data-key="x">x</button>
              <button class="key" data-key="c">c</button>
              <button class="key" data-key="v">v</button>
              <button class="key" data-key="b">b</button>
              <button class="key" data-key="n">n</button>
              <button class="key" data-key="m">m</button>
              <button class="key" data-key="-">-</button>
              <button class="key" data-backspace>⌫</button>
            </div>
            <div class="key-row">
              <button class="key wide" data-key=" ">Space</button>
              <button class="key" data-key=".">.</button>
              <button class="key" data-key="_">_</button>
              <button class="key" data-key="@">@</button>
              <button class="key" data-key="!">!</button>
              <button class="key" data-key="?">?</button>
            </div>
          </div>
          <div class="modal-actions">
            <button data-close>${cancelText}</button>
            <button class="primary" data-close>${confirmText}</button>
          </div>
        `;
        modalBackdrop.classList.add("open");
        modal.querySelectorAll("[data-key]").forEach((button) => {
          button.addEventListener("click", () => {
            passwordText += button.dataset.key;
            modal.querySelector("#keyboard-entry").value = "•".repeat(passwordText.length);
          });
        });
        modal.querySelector("[data-backspace]").addEventListener("click", () => {
          passwordText = passwordText.slice(0, -1);
          modal.querySelector("#keyboard-entry").value = "•".repeat(passwordText.length);
        });
        modal.querySelectorAll("[data-close]").forEach((button) => {
          button.addEventListener("click", closeModal);
        });
      }

      function keyRow(keys) {
        return `<div class="key-row">${[...keys].map((key) => `<button class="key" data-key="${key}">${key}</button>`).join("")}</div>`;
      }

      modalBackdrop.addEventListener("click", (event) => {
        if (event.target === modalBackdrop) closeModal();
      });

      showScreen("home");
    </script>
  </body>
</html>
