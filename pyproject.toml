[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-laser-controller"
version = "0.1.0"
description = "Orange Pi laser controller with local ST7796U/FT6336U touchscreen UI"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "pyudev>=0.24; sys_platform != 'darwin'",
    "PyYAML>=6.0",
    "smbus2>=0.4",
    "spidev>=3.6; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
travel-laser-controller = "backend.main:main"
travel-laser-ui = "backend.local_app:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
