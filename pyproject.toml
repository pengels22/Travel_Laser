[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ts1-laser-controller"
version = "0.1.0"
description = "Orange Pi backend for a Sculpfun TS1 laser controller retrofit"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "pyudev>=0.24; sys_platform != 'darwin'",
    "PyYAML>=6.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ts1-controller = "backend.main:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
