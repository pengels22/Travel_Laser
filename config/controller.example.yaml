controller:
  hostname: Travel-Laser

FIRE_SENSOR: false

laser:
  tcp_port: 23
  # Confirmed GRBL serial baud rate.
  baud: 115200
  mode: network
  usb:
    vid: null
    pid: null
    serial: null
    description_contains: null
  reconnect_timeout_seconds: 10
  status_poll_interval_seconds: 0.25

camera:
  enabled: true
  stream_type: webrtc
  resolution: highest_available
  usb:
    vid: null
    pid: null
    serial: null
    description_contains: null
  stream_url: null

display:
  controller: ST7796U
  width: 480
  height: 320
  rotation: 90
  # TODO: confirm Orange Pi SPI device after enabling SPI.
  spi_device: null
  spi_speed_hz: 24000000
  # TODO: choose and wire 3.3 V GPIO lines for D/C, RESET, and optional backlight.
  dc_gpio_chip: gpiochip0
  dc_gpio_line: null
  reset_gpio_chip: gpiochip0
  reset_gpio_line: null
  backlight_gpio_chip: gpiochip0
  backlight_gpio_line: null

touch:
  controller: FT6336U
  # TODO: confirm Orange Pi I2C bus after enabling I2C.
  i2c_bus: null
  i2c_address: 0x38
  rotation: 90
  # TODO: wire interrupt GPIO only if needed; polling fallback is supported.
  interrupt_gpio_chip: gpiochip0
  interrupt_gpio_line: null

gpio:
  power_input:
    # PC14 high means the physical laser power switch is on.
    # Switch signal is deterministic; do not configure internal pull-up/down bias unless hardware changes.
    chip: gpiochip0
    line: 78
    board_pin: PC14
    bias: none
    active_high: true
  estop_input:
    # PC15 high means E-stop OK. Low means E-stop active.
    # active_high is false because the software state means "E-stop active".
    # Switch signal is deterministic; do not configure internal pull-up/down bias unless hardware changes.
    chip: gpiochip0
    line: 79
    board_pin: PC15
    bias: none
    active_high: false
  k1_output:
    # Single hard E-stop relay output. Relay output is confirmed active high.
    chip: gpiochip0
    line: 72
    board_pin: PC8
    active_high: true

fire:
  # FIRE_SENSOR false blocks fire logic from affecting outputs until real fire hardware exists.
  sensor_enabled: false
  enabled: false
  active: false
  drop_k1: true
  stop_duration_ms: 1000
  auto_reenergize: false
  auto_home: false

virtualhere:
  service_name: virtualhere
  # VirtualHere is installed on the Orange Pi but configured separately by default.
  backend_controls_service: false

network:
  uplink_wifi:
    enabled: true
    interface: wlan1
    metric: 300
  ethernet:
    interface: eth0
    metric: 100
  ethernet_preferred: true

web:
  host: 0.0.0.0
  port: 8080

logging:
  level: INFO
  json_file: /var/log/travel-laser/events.jsonl
