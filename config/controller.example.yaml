controller:
  hostname: laserpi

FIRE_SENSOR: false

laser:
  tcp_port: 23
  # Confirmed GRBL serial baud rate.
  baud: 115200
  mode: network
  usb:
    vid: null
    pid: null
    serial: null
    description_contains: null
  reconnect_timeout_seconds: 10
  status_poll_interval_seconds: 0.25

camera:
  enabled: true
  usb:
    vid: null
    pid: null
    serial: null
    description_contains: null
  stream_url: null

gpio:
  power_input:
    # PC12 high means the physical laser power switch is on.
    # Switch signal is deterministic; do not configure internal pull-up/down bias unless hardware changes.
    chip: gpiochip0
    line: null
    board_pin: PC12
    bias: none
    active_high: true
  estop_input:
    # PC15 high means E-stop OK. Low means E-stop active.
    # active_high is false because the software state means "E-stop active".
    # Switch signal is deterministic; do not configure internal pull-up/down bias unless hardware changes.
    chip: gpiochip0
    line: null
    board_pin: PC15
    bias: none
    active_high: false
  k1_output:
    # Relay output is confirmed active high.
    # PC5 is expected to appear on gpiochip0 or gpiochip1.
    chip: null
    line: null
    board_pin: PC5
    active_high: true
  k2_output:
    # Relay output is confirmed active high.
    # PC8 is expected to appear on gpiochip0 or gpiochip1.
    chip: null
    line: null
    board_pin: PC8
    active_high: true

fire:
  # FIRE_SENSOR false blocks fire logic from affecting outputs until real fire hardware exists.
  sensor_enabled: false
  enabled: false
  active: false
  drop_k2: true
  stop_duration_ms: 1000
  auto_reenergize: false
  auto_home: false

network:
  private_ts1_ap:
    enabled: true
    always_enabled: true
    interface: wlan0
    hidden: true
    ssid: TS1PE
    password: AsDfGhJkL13579!
    address: 10.42.0.1/24
  uplink_wifi:
    enabled: true
    interface_hint: null
  ethernet_preferred: true

websocket:
  host: 10.42.0.1
  port: 8765
  path: /ws
  shared_token: CHANGE_ME

web:
  host: 0.0.0.0
  port: 8080

logging:
  level: INFO
  json_file: /var/log/ts1-controller/events.jsonl
