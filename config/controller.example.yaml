controller:
  hostname: Travel-Laser

FIRE_SENSOR: false

laser:
  tcp_port: 23
  baud: 115200
  mode: network
  usb:
    vid: null
    pid: null
    serial: null
    description_contains: null
  reconnect_timeout_seconds: 10
  status_poll_interval_seconds: 0.25

camera:
  enabled: true
  stream_type: webrtc
  resolution: highest_available
  usb:
    vid: null
    pid: null
    serial: null
    description_contains: null
  stream_url: null

display:
  controller: ST7796U
  width: 480
  height: 320
  rotation: 90

  # Physically validated on Armbian 26.11 / kernel 6.18.52-current-sunxi64.
  # SPI1: SCK PH6/pin23, MOSI PH7/pin19, MISO PH8/pin21, CS1 PH9/pin24.
  spi_device: /dev/spidev1.1
  spi_speed_hz: 10000000

  # LCD_DC / RS = PC6 / GPIO line 70 / physical pin 11.
  dc_gpio_chip: /dev/gpiochip1
  dc_gpio_line: 70

  # LCD_RST is physically connected to PC9 / GPIO73 / pin 7, but PC9 is
  # reserved by the Orange Pi Zero 3 PMIC interrupt and cannot be claimed
  # safely from userspace. The validated panel works without GPIO reset.
  reset_gpio_chip: null
  reset_gpio_line: null

  # Backlight is tied on in the current wiring.
  backlight_gpio_chip: null
  backlight_gpio_line: null

touch:
  controller: FT6336U

  # I2C3 on PH4/PH5 is exposed as /dev/i2c-2 on the validated image.
  i2c_bus: 2
  i2c_address: 0x38
  rotation: 90

  # CTP_RST = PC5 / GPIO line 69 / physical pin 13.
  reset_gpio_chip: /dev/gpiochip1
  reset_gpio_line: 69

  # The FT6336 backend polls I2C and does not require CTP_INT.
  # CTP_INT is not in use on this build, so leave it disabled.
  interrupt_gpio_chip: null
  interrupt_gpio_line: null

gpio:
  power_input:
    chip: /dev/gpiochip1
    line: 78
    board_pin: PC14
    bias: none
    active_high: true

  estop_input:
    chip: /dev/gpiochip1
    line: 79
    board_pin: PC15
    bias: none
    active_high: false

  k1_output:
    chip: /dev/gpiochip1
    line: 72
    board_pin: PC8
    active_high: true

fire:
  sensor_enabled: false
  enabled: false
  active: false
  drop_k1: true
  stop_duration_ms: 1000
  auto_reenergize: false
  auto_home: false

virtualhere:
  service_name: virtualhere
  backend_controls_service: false

network:
  uplink_wifi:
    enabled: true
    interface: wlan0
    metric: 300
  ethernet:
    interface: end0
    metric: 100
  tailscale:
    enabled: true
    interface: tailscale0
    ip_address: null
  ethernet_preferred: true

web:
  host: null
  bind_to_tailscale: true
  port: 8080

logging:
  level: INFO
  json_file: /var/log/travel-laser/events.jsonl
