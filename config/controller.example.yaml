controller:
  hostname: Travel-Laser

FIRE_SENSOR: false

laser:
  tcp_port: 23
  # Confirmed GRBL serial baud rate.
  baud: 115200
  mode: network
  usb:
    vid: null
    pid: null
    serial: null
    description_contains: null
  reconnect_timeout_seconds: 10
  status_poll_interval_seconds: 0.25

camera:
  enabled: true
  stream_type: webrtc
  resolution: highest_available
  usb:
    vid: null
    pid: null
    serial: null
    description_contains: null
  stream_url: null

display:
  controller: ST7796U
  width: 480
  height: 320
  rotation: 90
  # ST7796U uses SPI1 only: CS PH9/pin 24, MOSI PH7/pin 19, MISO PH8/pin 21, SCK PH6/pin 23.
  # Verify the OS exposes SPI1 as /dev/spidev1.0 after enabling SPI1.
  spi_device: /dev/spidev1.0
  spi_speed_hz: 24000000
  # LCD_DC/RS = PC6, Linux GPIO 70, physical pin 11.
  dc_gpio_chip: gpiochip0
  dc_gpio_line: 70
  # LCD_RST = PC9, Linux GPIO 73, physical pin 7.
  reset_gpio_chip: gpiochip0
  reset_gpio_line: 73
  backlight_gpio_chip: null
  backlight_gpio_line: null

touch:
  controller: FT6336U
  # FT6336U uses I2C3 only: SDA PH5/pin 3, SCL PH4/pin 5.
  # Verify the OS exposes I2C3 as /dev/i2c-3.
  i2c_bus: 3
  i2c_address: 0x38
  rotation: 90
  # CTP_RST = PC5, Linux GPIO 69, physical pin 13.
  reset_gpio_chip: gpiochip0
  reset_gpio_line: 69
  # Optional CTP_INT = PC11, Linux GPIO 75, physical pin 12.
  # Touch polling still works if this line is not connected.
  # Do not use PC8/GPIO 72 for CTP_INT; PC8 is reserved for K1.
  interrupt_gpio_chip: gpiochip0
  interrupt_gpio_line: 75

gpio:
  power_input:
    # PC14 high means laser input power is present.
    # Sense signal is deterministic; do not configure internal pull-up/down bias unless hardware changes.
    chip: gpiochip0
    line: 78
    board_pin: PC14
    bias: none
    active_high: true
  estop_input:
    # PC15 high means E-stop power sense is OK. Low means E-stop active.
    # active_high is false because the software state means "E-stop active".
    # Sense signal is deterministic; do not configure internal pull-up/down bias unless hardware changes.
    chip: gpiochip0
    line: 79
    board_pin: PC15
    bias: none
    active_high: false
  k1_output:
    # Single hard E-stop relay output. Relay output is confirmed active high.
    chip: gpiochip0
    line: 72
    board_pin: PC8
    active_high: true

fire:
  # FIRE_SENSOR false blocks fire logic from affecting outputs until real fire hardware exists.
  sensor_enabled: false
  enabled: false
  active: false
  drop_k1: true
  stop_duration_ms: 1000
  auto_reenergize: false
  auto_home: false

virtualhere:
  service_name: virtualhere
  # VirtualHere is installed on the Orange Pi but configured separately by default.
  backend_controls_service: false

network:
  uplink_wifi:
    enabled: true
    interface: wlan1
    metric: 300
  ethernet:
    interface: eth0
    metric: 100
  tailscale:
    enabled: true
    interface: tailscale0
    # scripts/deploy.sh fills this from `tailscale ip -4` after the device joins the tailnet.
    ip_address: null
  ethernet_preferred: true

web:
  # Deployment should listen only on the Tailscale IP, not every interface.
  # With bind_to_tailscale enabled, startup intentionally fails until network.tailscale.ip_address is set.
  host: null
  bind_to_tailscale: true
  port: 8080

logging:
  level: INFO
  json_file: /var/log/travel-laser/events.jsonl
